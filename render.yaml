services:
  - type: web
    name: clipfetch
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "10000"
      - key: MAX_FILE_SIZE_MB
        value: "250"
      - key: MAX_DURATION_SEC
        value: "1800"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: AUTO_CLEANUP_MINUTES
        value: "10"
